<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savera — Weer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #141414; --bg2: #1a1a1a; --bg3: #222;
  --accent: #e8b84b; --accent2: #4caf82; --warn: #e05c5c;
  --orange: #e8914b; --blue: #4b9fe8;
  --text: #fff; --muted: rgba(255,255,255,0.35);
  --border: rgba(255,255,255,0.07);
}
body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); min-height: 100vh; display: grid; grid-template-rows: 52px 1fr; }

header { background: var(--bg2); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border); }
.logo { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
.logo span { color: var(--accent); }
.hright { display: flex; align-items: center; gap: 14px; }
.live-pill { background: rgba(255,255,255,0.07); border-radius: 20px; padding: 5px 12px; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.ldot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }

.main { display: grid; grid-template-columns: 52px 1fr; overflow: hidden; height: 100%; }
.leftnav { background: var(--bg2); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; border-right: 1px solid var(--border); }
.nico { width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--muted); cursor: pointer; transition: all .2s; }
.nico:hover { color: var(--text); background: rgba(255,255,255,0.06); }
.nico.on { background: rgba(232,184,75,0.12); color: var(--accent); }
.spacer { flex: 1; }

.content { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 18px; }

.page-header { display: flex; align-items: center; justify-content: space-between; }
.page-title { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.page-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
.update-time { font-size: 11px; color: var(--muted); }

.card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
.card-title { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }

/* Huidig weer */
.weer-huidig { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
.weer-main { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 22px; grid-column: span 2; display: flex; align-items: center; gap: 20px; }
.weer-icon { font-size: 64px; line-height: 1; }
.weer-temp { font-size: 52px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
.weer-desc { font-size: 14px; color: var(--muted); margin-top: 4px; }
.weer-loc { font-size: 11px; color: var(--accent); margin-top: 6px; font-weight: 600; letter-spacing: 1px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.stat-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.stat-val { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; }
.stat-unit { font-size: 12px; color: var(--muted); margin-left: 3px; }
.stat-sub { font-size: 11px; color: var(--muted); margin-top: 5px; }

/* Waarschuwingen */
.waarsch { border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.waarsch:last-child { margin-bottom: 0; }
.waarsch.goed { background: rgba(76,175,130,0.08); border: 1px solid rgba(76,175,130,0.2); }
.waarsch.let-op { background: rgba(232,145,75,0.08); border: 1px solid rgba(232,145,75,0.2); }
.waarsch.gevaar { background: rgba(224,92,92,0.08); border: 1px solid rgba(224,92,92,0.2); }
.waarsch-ico { font-size: 20px; flex-shrink: 0; }
.waarsch-titel { font-size: 13px; font-weight: 600; }
.waarsch.goed .waarsch-titel { color: var(--accent2); }
.waarsch.let-op .waarsch-titel { color: var(--orange); }
.waarsch.gevaar .waarsch-titel { color: var(--warn); }
.waarsch-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Radar */
#radar-map { width: 100%; height: 420px; border-radius: 10px; background: #0a0a0a; }
.radar-controls { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.rbtn { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; transition: all .2s; }
.rbtn:hover { border-color: var(--accent); color: var(--accent); }
.rbtn.on { background: rgba(232,184,75,0.12); border-color: var(--accent); color: var(--accent); }
.rbtn.play { background: rgba(76,175,130,0.12); border-color: var(--accent2); color: var(--accent2); }
.radar-slider-wrap { margin-top: 10px; }
.radar-slider { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; appearance: none; outline: none; cursor: pointer; }
.radar-slider::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid #fff; }
.radar-slider-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: var(--muted); }
.radar-legenda { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.rleg-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }
.rleg-kleur { width: 14px; height: 8px; border-radius: 2px; }

/* Droog momenten */
.droog-advies { padding: 12px 16px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; font-weight: 600; line-height: 1.5; }
.droog-advies.goed { background: rgba(76,175,130,0.1); border: 1px solid rgba(76,175,130,0.25); color: var(--accent2); }
.droog-advies.matig { background: rgba(232,184,75,0.1); border: 1px solid rgba(232,184,75,0.25); color: var(--accent); }
.droog-advies.slecht { background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.25); color: var(--warn); }
.droog-tijdlijn { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.droog-blok { flex-shrink: 0; text-align: center; min-width: 56px; }
.droog-blok-bar { height: 36px; border-radius: 6px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.droog-blok-bar.droog { background: rgba(76,175,130,0.2); border: 1px solid rgba(76,175,130,0.3); }
.droog-blok-bar.kans { background: rgba(232,184,75,0.2); border: 1px solid rgba(232,184,75,0.3); }
.droog-blok-bar.regen { background: rgba(224,92,92,0.2); border: 1px solid rgba(224,92,92,0.3); }
.droog-blok-tijd { font-size: 10px; color: var(--muted); font-weight: 600; }
.droog-blok-kans { font-size: 10px; color: var(--muted); margin-top: 2px; }
.droog-blok.now .droog-blok-tijd { color: var(--accent); }

/* Uurlijks */
.uur-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.uur-item { flex-shrink: 0; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; text-align: center; min-width: 70px; }
.uur-item.now { border-color: var(--accent); background: rgba(232,184,75,0.08); }
.uur-tijd { font-size: 10px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
.uur-ico { font-size: 20px; margin-bottom: 6px; }
.uur-temp { font-size: 14px; font-weight: 700; }
.uur-regen { font-size: 10px; color: var(--blue); margin-top: 4px; }

/* 7 dagen */
.dag-rij { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.dag-rij:last-child { border-bottom: none; }
.dag-naam { font-size: 12px; font-weight: 600; width: 80px; }
.dag-naam.today { color: var(--accent); }
.dag-ico { font-size: 20px; width: 30px; text-align: center; }
.dag-bar { flex: 1; margin: 0 14px; height: 4px; background: rgba(255,255,255,0.07); border-radius: 2px; position: relative; }
.dag-bar-fill { position: absolute; height: 100%; border-radius: 2px; background: linear-gradient(to right, var(--blue), var(--accent)); }
.dag-temps { font-size: 12px; font-weight: 600; width: 70px; text-align: right; }
.dag-min { color: var(--muted); margin-right: 4px; }
.dag-regen { font-size: 11px; color: var(--blue); width: 40px; text-align: right; }

/* Kitesurf */
.kite-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.kite-status { flex: 1; }
.kite-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.kite-badge.gaat { background: rgba(76,175,130,0.15); border: 1px solid rgba(76,175,130,0.3); color: var(--accent2); }
.kite-badge.matig { background: rgba(232,184,75,0.15); border: 1px solid rgba(232,184,75,0.3); color: var(--accent); }
.kite-badge.niet { background: rgba(224,92,92,0.15); border: 1px solid rgba(224,92,92,0.3); color: var(--warn); }
.kite-grootte { text-align: center; padding: 16px; background: var(--bg3); border-radius: 12px; border: 1px solid var(--border); min-width: 120px; }
.kite-m2 { font-size: 36px; font-weight: 700; color: var(--accent); line-height: 1; }
.kite-m2-lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
.kite-details { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 14px; }
.kite-detail { background: var(--bg3); border-radius: 9px; padding: 12px; text-align: center; }
.kd-lbl { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 5px; }
.kd-val { font-size: 16px; font-weight: 700; }
.kite-tip { background: rgba(75,159,232,0.08); border: 1px solid rgba(75,159,232,0.2); border-radius: 10px; padding: 12px 14px; margin-top: 12px; font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.6; }
.kite-tip strong { color: var(--blue); }

/* Loading */
.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--muted); font-size: 13px; gap: 10px; }
.loading-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1s infinite; }
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

@media (max-width: 768px) {
  .main { grid-template-columns: 44px 1fr; }
  .leftnav { width: 44px; padding: 10px 0; }
  .nico { width: 30px; height: 30px; font-size: 14px; }
  .weer-huidig { grid-template-columns: 1fr 1fr; }
  .weer-main { grid-column: span 2; }
  .kite-details { grid-template-columns: 1fr 1fr; }
  .content { padding: 14px; gap: 12px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">SAVE<span>RA</span></div>
  <div class="hright">
    <div class="live-pill"><div class="ldot"></div> Live · Schellinkhout</div>
    <div style="font-size:13px;color:var(--muted)" id="clk">00:00</div>
  </div>
</header>

<div class="main">
  <nav class="leftnav">
    <div class="nico" title="Dashboard" onclick="window.location.href='/'">🏠</div>
    <div class="nico on" title="Weer">🌤️</div>
    <div class="nico" title="Water" onclick="window.location.href='/water'">💧</div>
    <div class="nico" title="Energie">⚡</div>
    <div class="nico" title="Gas">⚡</div>
    <div class="nico" title="Klimaat">🌡️</div>
    <div class="nico" title="Beveiliging">🔒</div>
    <div class="nico" title="Planten">🌿</div>
    <div class="spacer"></div>
    <div class="nico" title="Instellingen">⚙️</div>
  </nav>

  <div class="content" id="content">
    <div class="loading">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      Weer ophalen voor Schellinkhout...
    </div>
  </div>
</div>

<script>
const LAT = 52.6567, LON = 5.1833;

// Clock
setInterval(() => {
  const n = new Date();
  document.getElementById('clk').textContent =
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}, 1000);

// Nav
document.querySelectorAll('.nico').forEach(n => n.addEventListener('click', function() {
  if(this.title === 'Weer') return;
  document.querySelectorAll('.nico').forEach(x => x.classList.remove('on'));
  this.classList.add('on');
}));

// ── Hulpfuncties ──
function weerIcon(code, isDay=true) {
  const icons = {0:isDay?'☀️':'🌙',1:isDay?'🌤️':'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌨️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
  return icons[code] || '🌤️';
}
function weerOmschrijving(code) {
  const desc = {0:'Helder',1:'Overwegend helder',2:'Gedeeltelijk bewolkt',3:'Bewolkt',45:'Mist',48:'Ijsmist',51:'Lichte motregen',53:'Matige motregen',55:'Zware motregen',61:'Lichte regen',63:'Matige regen',65:'Zware regen',71:'Lichte sneeuw',73:'Matige sneeuw',75:'Zware sneeuw',80:'Lichte buien',81:'Matige buien',82:'Zware buien',95:'Onweer',96:'Onweer met hagel',99:'Zwaar onweer'};
  return desc[code] || 'Onbekend';
}
function windRichting(g) {
  return ['N','NNO','NO','ONO','O','OZO','ZO','ZZO','Z','ZZW','ZW','WZW','W','WNW','NW','NNW'][Math.round(g/22.5)%16];
}
function windBeaufort(ms) {
  if(ms<0.3)return 0;if(ms<1.6)return 1;if(ms<3.4)return 2;if(ms<5.5)return 3;
  if(ms<8.0)return 4;if(ms<10.8)return 5;if(ms<13.9)return 6;if(ms<17.2)return 7;
  if(ms<20.8)return 8;if(ms<24.5)return 9;if(ms<28.5)return 10;if(ms<32.7)return 11;return 12;
}

// ── Kitesurf advies ──
function kiteAdvies(windMS, windstootMS, richting) {
  const kn = windMS*1.94384, st = windstootMS*1.94384, bf = windBeaufort(windMS);
  let maat='—', status='niet', statusTekst='Niet kitesurfen', tip='';
  if(kn<10){tip='Minimaal 10 knopen nodig voor een 80kg rijder.';}
  else if(kn<14){status='matig';statusTekst='Lichte wind';maat='17';tip=`${Math.round(kn)} kn (Bft ${bf}). Met 17m² kite is het mogelijk.`;}
  else if(kn<18){status='gaat';statusTekst='Goede kitesurfwind!';maat='14-17';tip=`${Math.round(kn)} kn (Bft ${bf}). Prima sessie!`;}
  else if(kn<22){status='gaat';statusTekst='Ideale wind!';maat='12';tip=`${Math.round(kn)} kn (Bft ${bf}). Perfecte omstandigheden!`;}
  else if(kn<27){status='gaat';statusTekst='Sterke wind';maat='9-10';tip=`${Math.round(kn)} kn (Bft ${bf}). Let op stoten (${Math.round(st)} kn).`;}
  else if(kn<32){status='matig';statusTekst='Veel wind';maat='7-9';tip=`${Math.round(kn)} kn (Bft ${bf}). Alleen gevorderden.`;}
  else{tip=`${Math.round(kn)} kn — te gevaarlijk!`;}
  const gunstig=['W','WZW','ZW','NW','NNW','WNW'].includes(richting);
  return {maat,status,statusTekst,tip,knopen:Math.round(kn),bf,stoten:Math.round(st),gunstig,richting};
}

// ── Huis waarschuwingen ──
function huisWaarschuwingen(data, idx) {
  const w=[], regenKans=data.hourly.precipitation_probability[idx], wind=data.current.wind_speed_10m*3.6, temp=data.current.temperature_2m, vocht=data.current.relative_humidity_2m;
  if(regenKans>70)w.push({type:'let-op',ico:'🌧️',titel:`Regen verwacht (${regenKans}% kans)`,sub:'Sluit ramen en deuren.'});
  if(wind>54)w.push({type:'let-op',ico:'💨',titel:`Harde wind (${Math.round(wind)} km/u)`,sub:'Zorg voor losse spullen in de tuin.'});
  if(temp<2)w.push({type:'gevaar',ico:'🧊',titel:`Vorst (${temp}°C)`,sub:'Check waterleidingen. Laat kraan druppelen.'});
  if(temp>28)w.push({type:'let-op',ico:'🌡️',titel:`Tropisch warm (${temp}°C)`,sub:'Sluit gordijnen overdag.'});
  if(vocht>85)w.push({type:'let-op',ico:'💧',titel:`Hoge luchtvochtigheid (${vocht}%)`,sub:'Ventileer het huis.'});
  if(w.length===0)w.push({type:'goed',ico:'✅',titel:'Geen bijzondere omstandigheden',sub:'Het weer is prima voor uw woning.'});
  return w;
}

// ── Buienradar droge momenten ──
async function haalBuienradar() {
  try {
    const resp = await fetch(`https://gpsgadget.buienradar.nl/data/raintext?lat=${LAT}&lon=${LON}`);
    const text = await resp.text();
    return text.trim().split('\n').map(r => {
      const [waarde, tijd] = r.split('|');
      const mm = waarde ? Math.max(0, Math.pow(10, (parseInt(waarde)-109)/32)) : 0;
      return {mm: parseFloat(mm.toFixed(2)), tijd: tijd ? tijd.trim() : ''};
    });
  } catch(e) { return null; }
}

async function droogeMomenten() {
  const data = await haalBuienradar();
  if(!data || data.length===0) return '<div class="droog-advies matig">⚠️ Data tijdelijk niet beschikbaar.</div>';
  const nuRegen = data[0].mm > 0.1;
  const eersteRegen = data.findIndex((d,i)=>i>0&&d.mm>0.1);
  const eersteDroog = data.findIndex((d,i)=>i>0&&d.mm<=0.1);
  let advies, kls;
  if(!nuRegen) {
    if(eersteRegen===-1){advies='✅ De komende 2 uur blijft het droog!';kls='goed';}
    else{advies=`✅ Nu droog — regen verwacht om ${data[eersteRegen].tijd}.`;kls='goed';}
  } else {
    if(eersteDroog!==-1){advies=`🌧️ Het regent nu. Droog vanaf ${data[eersteDroog].tijd}.`;kls='slecht';}
    else{advies='🌧️ De komende 2 uur blijft het regenen.';kls='slecht';}
  }
  const tijdlijn = data.map((d,i)=>{
    const kl=d.mm<=0.1?'droog':d.mm<1?'kans':'regen';
    const ico=d.mm<=0.1?'✅':d.mm<1?'🌦️':'🌧️';
    return `<div class="droog-blok ${i===0?'now':''}"><div class="droog-blok-bar ${kl}">${ico}</div><div class="droog-blok-tijd">${d.tijd}</div><div class="droog-blok-kans">${d.mm<=0.1?'Droog':d.mm<1?'Licht':'Regen'}</div></div>`;
  }).join('');
  return `<div class="droog-advies ${kls}">${advies}</div><div style="font-size:10px;color:var(--muted);margin-bottom:10px;">📡 Buienradar · Komende 2 uur · 5-min intervallen</div><div class="droog-tijdlijn">${tijdlijn}</div>`;
}

// ── Weer ophalen ──
async function haalWeer() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,uv_index,is_day&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset&wind_speed_unit=ms&timezone=Europe/Amsterdam&forecast_days=7`;
    const resp = await fetch(url);
    const data = await resp.json();
    const nu = new Date();
    const idx = nu.getHours();
    const temp = Math.round(data.current.temperature_2m);
    const gevoels = Math.round(data.current.apparent_temperature);
    const vochtigheid = data.current.relative_humidity_2m;
    const windMS = data.current.wind_speed_10m;
    const windKMH = Math.round(windMS*3.6);
    const windStoot = data.current.wind_gusts_10m;
    const windStootKMH = Math.round(windStoot*3.6);
    const uvIndex = Math.round(data.current.uv_index);
    const weerCode = data.current.weather_code;
    const isDay = data.current.is_day;
    const richting = windRichting(data.current.wind_direction_10m);
    const bf = windBeaufort(windMS);
    const opkomst = new Date(data.daily.sunrise[0]).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    const ondergang = new Date(data.daily.sunset[0]).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    const kite = kiteAdvies(windMS, windStoot, richting);
    const waarsch = huisWaarschuwingen(data, idx);
    const uurData = [];
    for(let i=idx;i<Math.min(idx+12,24);i++){
      uurData.push({tijd:i===idx?'Nu':`${String(i).padStart(2,'0')}:00`,temp:Math.round(data.hourly.temperature_2m[i]),ico:weerIcon(data.hourly.weather_code[i],i>=6&&i<=21),regen:data.hourly.precipitation_probability[i],isNow:i===idx});
    }
    const dagNamen=['Zo','Ma','Di','Wo','Do','Vr','Za'];
    const minT=Math.min(...data.daily.temperature_2m_min);
    const maxT=Math.max(...data.daily.temperature_2m_max);
    renderWeer({temp,gevoels,vochtigheid,windKMH,windStootKMH,richting,bf,uvIndex,weerCode,isDay,opkomst,ondergang,kite,waarsch,uurData,daily:data.daily,dagNamen,minT,maxT,nu});
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="loading">❌ Kon weer niet ophalen.</div>';
  }
}

function renderWeer(d) {

    <div class="page-header">
      <div>

        <div class="page-sub">Hyperlokaaal weer · IJsselmeer regio</div>

      <div class="update-time">Bijgewerkt: ${d.nu.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>

    <div class="weer-huidig">
      <div class="weer-main">
        <div class="weer-icon">${weerIcon(d.weerCode,d.isDay)}</div>
        <div>
          <div class="weer-temp">${d.temp}°<span style="font-size:24px;color:var(--muted)">C</span></div>
          <div class="weer-desc">${weerOmschrijving(d.weerCode)} · Voelt als ${d.gevoels}°C</div>

      </div>

        <div class="stat-sub">${d.richting} · Bft ${d.bf} · Stoten ${d.windStootKMH} km/u</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">💧 Luchtvochtigheid</div>
        <div class="stat-val">${d.vochtigheid}<span class="stat-unit">%</span></div>
        <div class="stat-sub">${d.vochtigheid>70?'Hoog — ventileer het huis':'Normaal'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">☀️ UV Index</div>
        <div class="stat-val" style="color:${d.uvIndex<=2?'var(--accent2)':d.uvIndex<=5?'var(--accent)':'var(--warn)'}">${d.uvIndex}</div>
        <div class="stat-sub">${d.uvIndex<=2?'Laag':d.uvIndex<=5?'Matig':d.uvIndex<=7?'Hoog':'Zeer hoog'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🌅 Zon</div>
        <div style="font-size:14px;font-weight:600;margin-top:4px">${d.opkomst} → ${d.ondergang}</div>
        <div class="stat-sub">op- en ondergang</div>
      </div>
    </div>

    <!-- Huis waarschuwingen -->
    <div class="card">
      <div class="card-title">🏠 Weer & uw woning</div>
      ${d.waarsch.map(w=>`<div class="waarsch ${w.type}"><div class="waarsch-ico">${w.ico}</div><div><div class="waarsch-titel">${w.titel}</div><div class="waarsch-sub">${w.sub}</div></div></div>`).join('')}
    </div>

    <!-- KNMI Neerslagkaart -->
    <div class="card">
      <div class="card-title">📡 Neerslagkaart · KNMI officiële radar</div>
      <div style="position:relative;">
        <div id="radar-map"></div>
        <div id="radar-tijd-overlay" style="position:absolute;top:10px;left:10px;z-index:1000;background:rgba(14,14,14,0.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 14px;font-size:14px;font-weight:700;color:#e8b84b;pointer-events:none;">Laden...</div>
      </div>
      <div class="radar-controls">
        <button class="rbtn on" id="rbtn-1u" onclick="setRadarUren(1)">1 uur</button>
        <button class="rbtn" id="rbtn-3u" onclick="setRadarUren(3)">3 uur</button>
        <button class="rbtn" id="rbtn-6u" onclick="setRadarUren(6)">6 uur</button>
        <button class="rbtn" id="rbtn-12u" onclick="setRadarUren(12)">12 uur</button>
        <button class="rbtn" id="rbtn-24u" onclick="setRadarUren(24)">24 uur</button>

      <div class="radar-slider-wrap">
        <input type="range" class="radar-slider" id="radar-slider" min="0" value="0" oninput="radarSliderChange(this.value)">
        <div class="radar-slider-labels"><span id="rlbl-start">—</span><span id="rlbl-eind">Nu</span></div>
      </div>
      <div class="radar-legenda">
        <span style="font-size:10px;color:var(--muted);margin-right:4px">Neerslag:</span>
        <div class="rleg-item"><div class="rleg-kleur" style="background:#b3f0b3"></div> Licht</div>
        <div class="rleg-item"><div class="rleg-kleur" style="background:#40c0ff"></div> Matig</div>

    <!-- Uurlijks -->

      ${d.daily.weather_code.map((code,i)=>{
        const datum=new Date(); datum.setDate(datum.getDate()+i);
        const naam=i===0?'Vandaag':i===1?'Morgen':d.dagNamen[datum.getDay()];
        const max=Math.round(d.daily.temperature_2m_max[i]);
        const min=Math.round(d.daily.temperature_2m_min[i]);
        const regen=d.daily.precipitation_probability_max[i];
        const bw=((max-d.minT)/(d.maxT-d.minT))*70;
        const bs=((min-d.minT)/(d.maxT-d.minT))*30;
        return `<div class="dag-rij"><div class="dag-naam ${i===0?'today':''}">${naam}</div><div class="dag-ico">${weerIcon(code,true)}</div><div class="dag-bar"><div class="dag-bar-fill" style="left:${bs}%;width:${bw}%"></div></div><div class="dag-temps"><span class="dag-min">${min}°</span>${max}°</div><div class="dag-regen">💧${regen}%</div></div>`;
      }).join('')}
    </div>
  `;

  // Initialiseer radar en buienradar
  setTimeout(() => initRadar(), 200);
  setTimeout(async () => {
    const c = document.getElementById('droog-container');
    if(c) c.innerHTML = await droogeMomenten();
  }, 300);
}

// ── KNMI Radar via proxy ──
let radarMap = null, radarLaag = null, radarFrames = [], radarIdx = 0;
let radarUren = 1;

function initRadar() {
  if(radarMap) { radarMap.invalidateSize(); return; }

  radarMap = L.map('radar-map', {
    center: [LAT, LON],
    zoom: 7,
    minZoom: 5,
    maxZoom: 13,
    zoomControl: true,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19
  }).addTo(radarMap);

  L.circleMarker([LAT, LON], {
    radius: 7, fillColor: '#e8b84b', color: '#fff', weight: 2, fillOpacity: 1, zIndexOffset: 1000
  }).bindTooltip('Schellinkhout').addTo(radarMap);

  document.getElementById('radar-map').addEventListener('wheel', e => e.stopPropagation(), {passive: false});

  laadRadar(radarUren);
}

function genereerRadarFrames(uren) {
  const lijst = [];
  const nu = new Date();
  nu.setSeconds(0, 0);
  nu.setMinutes(Math.floor(nu.getMinutes()/5)*5 - 5);
  const start = new Date(nu.getTime() - uren*60*60*1000);
  for(let t = start.getTime(); t <= nu.getTime(); t += 5*60*1000) {
    lijst.push(new Date(t));
  }
  return lijst;
}

function laadRadar(uren) {
  radarUren = uren;
  radarFrames = genereerRadarFrames(uren);
  radarIdx = radarFrames.length - 1;

  // Reset de WMS laag zodat hij opnieuw laadt
  if(radarLaag && radarMap) {
    radarMap.removeLayer(radarLaag);
    radarLaag = null;
  }

  const slider = document.getElementById('radar-slider');
  if(slider) {
    slider.max = radarFrames.length - 1;
    slider.value = radarIdx;
  }

  const fmt = d => d.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
  const ls = document.getElementById('rlbl-start');
  const le = document.getElementById('rlbl-eind');
  if(ls) ls.textContent = fmt(radarFrames[0]);
  if(le) le.textContent = fmt(radarFrames[radarFrames.length-1]) + ' (Nu)';

  toonRadarFrame(radarIdx);
}

function toonRadarFrame(idx) {
  if(!radarMap || !radarFrames[idx]) return;
  radarIdx = idx;

  const tijd = radarFrames[idx];
  const tijdISO = tijd.toISOString().split('.')[0] + 'Z';

  // Update bestaande laag TIME parameter in plaats van nieuwe laag maken
  if(radarLaag) {
    radarLaag.setParams({TIME: tijdISO}, false);
  } else {
    radarLaag = L.tileLayer.wms('/api/radar/tiles', {
      layers: 'precipitation',
      styles: 'precip-smooth-white-to-purple/bilinear',
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      TIME: tijdISO,
      opacity: 0.85,
      zIndex: 10,
      uppercase: true,
    }).addTo(radarMap);
  }

  // Tijd overlay
  const tijdStr = tijd.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'});
  const datStr = tijd.toLocaleDateString('nl-NL', {weekday:'short', day:'2-digit', month:'short'});
  const overlay = document.getElementById('radar-tijd-overlay');
  if(overlay) overlay.textContent = idx === radarFrames.length-1 ? `${tijdStr} (Nu)` : `${datStr} · ${tijdStr}`;

  const slider = document.getElementById('radar-slider');
  if(slider) slider.value = idx;
}

function setRadarUren(u) {
  document.querySelectorAll('.rbtn[id^=rbtn-]').forEach(b => {
    if(b.id !== 'rbtn-play') b.classList.remove('on');
  });
  const btn = document.getElementById(`rbtn-${u}u`);
  if(btn) btn.classList.add('on');
  laadRadar(u);
}

function radarSliderChange(val) {
  toonRadarFrame(parseInt(val));
}



// Start
haalWeer();
setInterval(haalWeer, 5*60*1000);
setInterval(async () => {
  const c = document.getElementById('droog-container');
  if(c) c.innerHTML = await droogeMomenten();
}, 2*60*1000);
</script>
